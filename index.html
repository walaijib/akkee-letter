<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AKKEE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Mono:wght@400;500&display=swap"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

html,body{
  background:#fff;
  color:#111;
  font-family:'Courier Prime','Noto Sans Mono',monospace;
  font-size:1rem;
  line-height:1.95;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:#111;color:#fff;}

/* ── screens ── */
.s{display:none;min-height:100vh;}
.s.on{display:block;}
.vc{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.vc .w{padding-top:0;padding-bottom:0;}

/* ── wrap ── */
.w{max-width:600px;margin:0 auto;padding:72px 32px 96px;}

/* ── wordmark ── */
.wm{
  font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;
  color:#111;display:block;font-weight:400;
}

/* ── topbar ── */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:64px;}

/* ── lang toggle ── */
.lt{font-size:.68rem;letter-spacing:.12em;cursor:pointer;user-select:none;color:#999;}
.lt .on{color:#111;text-decoration:underline;text-underline-offset:3px;}

/* ── section label ── */
.slbl{
  font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;
  color:#999;display:block;margin-bottom:14px;
}

/* ── password input ── */
.pf{
  display:block;width:100%;
  border:none;border-bottom:1px solid #111;
  background:transparent;outline:none;
  font-family:'Courier Prime',monospace;
  font-size:1.1rem;letter-spacing:.25em;color:#111;
  padding:8px 0 12px;
}
.pf::placeholder{color:#ccc;letter-spacing:.1em;}
.err{font-size:.72rem;color:#B80F17;margin-top:8px;min-height:1.1em;}

/* ── buttons ── */
.btn{
  font-family:'Courier Prime',monospace;
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
  border:1px solid #111;background:#fff;color:#111;
  padding:10px 24px;cursor:pointer;
}
.btn:hover{background:#111;color:#fff;}

.btn-blk{
  font-family:'Courier Prime',monospace;
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
  border:1px solid #111;background:#111;color:#fff;
  padding:10px 24px;cursor:pointer;
}
.btn-blk:hover{background:#333;border-color:#333;}

.btn-red{
  font-family:'Courier Prime',monospace;
  font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;
  border:none;background:#B80F17;color:#fff;
  padding:13px 40px;cursor:pointer;
}
.btn-red:disabled{background:#ddd;color:#aaa;cursor:default;}

.ghost{
  font-family:'Courier Prime',monospace;
  font-size:.68rem;letter-spacing:.1em;
  background:none;border:none;color:#999;
  cursor:pointer;padding:0;
  text-decoration:underline;text-underline-offset:3px;
}
.ghost:hover{color:#111;}

/* ── separator ── */
.sep{border:none;border-top:1px solid #e8e8e8;margin:44px 0;}

/* ── letter ── */
.l-loc{font-size:.68rem;letter-spacing:.16em;color:#999;margin-bottom:36px;}
.l-greet{font-style:italic;margin-bottom:1.8em;}
.l-body p{margin-bottom:1.75em;}
.l-body p:last-child{margin-bottom:0;}
.l-signoff{margin-top:2em;}

.toggle-v{
  font-size:.7rem;color:#999;letter-spacing:.06em;
  cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;display:inline-block;margin-bottom:22px;
}
.toggle-v:hover{color:#111;}

/* ── form ── */
.field{margin-bottom:40px;}
.flbl{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:#999;margin-bottom:12px;}
.fi{
  display:block;width:100%;
  border:none;border-bottom:1px solid #ddd;
  background:transparent;outline:none;
  font-family:'Courier Prime','Noto Sans Mono',monospace;
  font-size:.98rem;padding:7px 0 10px;color:#111;
  transition:border-color .15s;
}
.fi:focus{border-bottom-color:#111;}
.fi::placeholder{color:#ccc;}
.fta{
  display:block;width:100%;
  border:1px solid #ddd;
  background:transparent;outline:none;
  font-family:'Courier Prime','Noto Sans Mono',monospace;
  font-size:.95rem;padding:11px 13px;color:#111;
  resize:vertical;min-height:80px;
  transition:border-color .15s;
}
.fta:focus{border-color:#111;}
.fta::placeholder{color:#ccc;}

/* ── tick / radio ── */
.tick{display:flex;align-items:flex-start;gap:13px;margin-bottom:14px;cursor:pointer;user-select:none;}
.tbox{
  width:13px;height:13px;flex-shrink:0;margin-top:5px;
  border:1px solid #bbb;background:transparent;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s;
}
.tbox.r{border-radius:50%;}
.tbox.on{border-color:#111;background:#111;}
.ck{color:#fff;font-size:8px;display:none;line-height:1;}
.dot{width:5px;height:5px;border-radius:50%;background:#fff;display:none;}
.tbox.on .ck,.tbox.on .dot{display:block;}
.tlbl{font-size:.94rem;line-height:1.75;color:#111;}

/* ── contact sub-label ── */
.clbl{font-size:.63rem;letter-spacing:.18em;text-transform:uppercase;color:#999;margin-bottom:7px;}

/* ── dashboard ── */
.rcard{border-top:1px solid #eee;padding:26px 0;}
.rname{font-size:1rem;font-weight:700;color:#111;margin-bottom:4px;}
.rmeta{font-size:.8rem;color:#999;line-height:1.85;margin-bottom:3px;}
.rquote{font-size:.9rem;line-height:1.85;font-style:italic;margin:10px 0;color:#333;}
.ract{font-size:.8rem;color:#555;line-height:1.75;margin-bottom:3px;}
.rcontact{font-size:.76rem;color:#999;margin-top:6px;line-height:1.8;}

@media(max-width:480px){
  .w{padding:52px 20px 72px;}
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     SCREEN 1 — VISITOR PASSWORD
═══════════════════════════════════════════ -->
<div id="s-pass" class="s on">
  <div class="vc">
    <div class="w" style="max-width:400px;">

      <span class="wm" style="margin-bottom:20px;">AKKEE</span>

      <p id="tagline" style="font-size:.82rem;color:#555;line-height:1.9;margin-bottom:52px;">
        Join us in building a better food system for everyone
      </p>

      <span class="slbl">Visitor Password</span>
      <input id="pass-in" class="pf" type="password"
        autocomplete="off" placeholder="· · · · · · · ·"
        oninput="clrErr('pass-err')"
        onkeydown="if(event.key==='Enter')doLogin()"/>
      <p class="err" id="pass-err"></p>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;">
        <button class="btn" onclick="doLogin()">Enter</button>
        <span class="lt" onclick="toggleLang()">
          <span class="on" id="l-en">EN</span>&nbsp;·&nbsp;<span id="l-th">TH</span>
        </span>
      </div>

      <div class="sep"></div>

      <span class="slbl">Author Access</span>
      <button class="btn-blk" onclick="go('s-author-pass')">I'm the Author</button>

    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     SCREEN 1b — AUTHOR LOGIN
═══════════════════════════════════════════ -->
<div id="s-author-pass" class="s">
  <div class="vc">
    <div class="w" style="max-width:400px;">

      <span class="wm" style="margin-bottom:12px;">AKKEE</span>
      <span class="slbl" style="margin-bottom:48px;">Author Access</span>

      <input id="auth-in" class="pf" type="password"
        autocomplete="off" placeholder="· · · · · · · ·"
        oninput="clrErr('auth-err')"
        onkeydown="if(event.key==='Enter')doAuthorLogin()"/>
      <p class="err" id="auth-err"></p>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;">
        <button class="btn" onclick="doAuthorLogin()">Enter</button>
        <button class="ghost" onclick="go('s-pass')">← home</button>
      </div>

    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     SCREEN 2 — LETTER
═══════════════════════════════════════════ -->
<div id="s-letter" class="s">
  <div class="w">

    <div class="topbar">
      <span class="wm">AKKEE</span>
      <div style="display:flex;align-items:center;gap:24px;">
        <button class="ghost" onclick="go('s-pass')">home</button>
        <span class="lt" onclick="toggleLang();buildLetter()">
          <span id="lb-en" class="on">EN</span>&nbsp;·&nbsp;<span id="lb-th">TH</span>
        </span>
      </div>
    </div>

    <p class="l-loc" id="l-loc"></p>
    <p class="l-greet" id="l-greet"></p>
    <div class="l-body" id="l-body"></div>
    <p class="l-signoff" id="l-signoff" style="display:none;"></p>

    <div class="sep"></div>

    <span class="toggle-v" id="l-toggle" onclick="flipView()"></span><br/>
    <button class="btn-red" id="ready-btn" style="margin-top:8px;"></button>

  </div>
</div>

<!-- ═══════════════════════════════════════
     SCREEN 3 — FORM
═══════════════════════════════════════════ -->
<div id="s-form" class="s">
  <div class="w">

    <div class="topbar">
      <span class="wm">AKKEE</span>
      <div style="display:flex;align-items:center;gap:24px;">
        <button class="ghost" onclick="go('s-pass')">home</button>
        <button class="ghost" onclick="go('s-letter')">← back</button>
      </div>
    </div>

    <p id="f-title" style="font-size:.95rem;margin-bottom:52px;color:#111;line-height:1.7;"></p>

    <div class="field"><p class="flbl" id="lbl1"></p><input id="f-name" class="fi" oninput="chkForm()"/></div>
    <div class="field"><p class="flbl" id="lbl2"></p><input id="f-biz" class="fi" oninput="chkForm()"/></div>

    <div class="field">
      <p class="flbl" id="lbl3"></p>
      <div id="role-list" style="margin-top:10px;"></div>
      <div id="other-w" style="display:none;margin-top:8px;">
        <input id="f-other" class="fi" style="max-width:280px;"/>
      </div>
    </div>

    <div class="field"><p class="flbl" id="lbl4"></p><textarea id="f-why" class="fta"></textarea></div>

    <div class="field">
      <p class="flbl" id="lbl5"></p>
      <p id="f-gather" style="font-size:.82rem;color:#999;margin-bottom:18px;line-height:1.75;"></p>
      <div id="attend-list"></div>
    </div>

    <div class="field">
      <p class="flbl" id="lbl6"></p>
      <div id="activity-list" style="margin-top:10px;"></div>
    </div>

    <div class="field" style="margin-bottom:52px;">
      <p class="flbl" id="lbl7"></p>
      <div style="margin-bottom:24px;"><p class="clbl">Email *</p><input id="f-email" type="email" class="fi" oninput="chkForm()"/></div>
      <div style="margin-bottom:24px;"><p class="clbl">Phone</p><input id="f-phone" type="tel" class="fi"/></div>
      <div style="margin-bottom:24px;"><p class="clbl">LINE</p><input id="f-line" class="fi"/></div>
      <div><p class="clbl">IG</p><input id="f-ig" class="fi"/></div>
    </div>

    <p id="f-serr" style="font-size:.74rem;color:#B80F17;margin-bottom:12px;display:none;"></p>
    <button class="btn-red" id="submit-btn" onclick="doSubmit()" disabled></button>
    <p id="f-note" style="font-size:.67rem;color:#999;margin-top:12px;"></p>

  </div>
</div>

<!-- ═══════════════════════════════════════
     SCREEN 4 — THANKS
═══════════════════════════════════════════ -->
<div id="s-thanks" class="s">
  <div class="vc">
    <div class="w" style="max-width:480px;">
      <span class="wm" style="margin-bottom:56px;">AKKEE</span>
      <p id="t-msg" style="font-size:.98rem;line-height:2.1;margin-bottom:24px;"></p>
      <p id="t-sign" style="font-size:.84rem;color:#999;font-style:italic;margin-bottom:40px;"></p>
      <button class="ghost" onclick="go('s-pass')">← home</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     SCREEN 5 — AUTHOR DASHBOARD
═══════════════════════════════════════════ -->
<div id="s-dash" class="s">
  <div class="w">

    <div class="topbar">
      <span class="wm">AKKEE</span>
      <button class="ghost" onclick="go('s-pass')">← home</button>
    </div>

      <span id="r-count"></span>
      <button class="btn" id="dl-btn" onclick="" style="display:none;"></button>
    </div>

    <div id="r-list"></div>

  </div>
</div>

function go(id){
  document.querySelectorAll('.s').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}
function toggleLang(){ lang=lang==='en'?'th':'en'; setLangUI(); }
function setLangUI(){
  const en=lang==='en';
  ['l-en','lb-en'].forEach(id=>{const e=document.getElementById(id);if(e)e.className=en?'on':'';});
  ['l-th','lb-th'].forEach(id=>{const e=document.getElementById(id);if(e)e.className=en?'':'on';});
  const tl=document.getElementById('tagline');
  if(tl)tl.textContent=en
    ?'Join us in building a better food system for everyone'
    :'ร่วมกันพัฒนาระบบอาหารที่ยั่งยืน';
}
function clrErr(id){ document.getElementById(id).textContent=''; }

function doLogin(){
  const v=document.getElementById('pass-in').value.trim().toLowerCase();
  document.getElementById('pass-in').value='';
  if(v===VP){ buildLetter(); go('s-letter'); }
  else{ document.getElementById('pass-err').textContent=C[lang].passErr; }
}
function doAuthorLogin(){
  const v=document.getElementById('auth-in').value.trim().toLowerCase();
  document.getElementById('auth-in').value='';
  if(v===AP){ loadResp(); go('s-dash'); }
  else{ document.getElementById('auth-err').textContent='incorrect.'; }
}

function buildLetter(){
  const t=C[lang], paras=isFull?t.full:t.short;
  document.getElementById('l-loc').textContent=t.loc;
  document.getElementById('l-greet').textContent=t.greeting;
  document.getElementById('l-body').innerHTML=paras.map(p=>`<p>${p}</p>`).join('');
  const sf=document.getElementById('l-signoff');
  sf.innerHTML=isFull?t.signoff:'';
  sf.style.display=isFull?'block':'none';
  document.getElementById('l-toggle').textContent=isFull?t.tShort:t.tFull;
  document.getElementById('ready-btn').textContent=t.ready;
  setLangUI();
}
function flipView(){ isFull=!isFull; buildLetter(); }

function buildForm(){
  const t=C[lang];
  roles=[]; attend=''; activities=[];
  const map={
    'f-title':t.formTitle,'lbl1':t.lbl1,'lbl2':t.lbl2,'lbl3':t.lbl3,
    'lbl4':t.lbl4,'lbl5':t.lbl5,'lbl6':t.lbl6,'lbl7':t.lbl7,
    'f-gather':t.gather,'f-note':t.note,'submit-btn':t.submit
  };
  Object.entries(map).forEach(([id,v])=>{const e=document.getElementById(id);if(e)e.textContent=v;});
  const ph={'f-name':t.namePh,'f-biz':t.bizPh,'f-why':t.whyPh,'f-other':t.otherPh};
  Object.entries(ph).forEach(([id,v])=>{const e=document.getElementById(id);if(e)e.placeholder=v;});

  document.getElementById('role-list').innerHTML=t.roles.map((r,i)=>`
    <div class="tick" onclick="togRole('${r.replace(/'/g,"\\'")}',${i})">
      <span class="tbox" id="rb${i}"><span class="ck">✓</span></span>
      <span class="tlbl">${r}</span>
    </div>`).join('');

  document.getElementById('attend-list').innerHTML=t.attend.map((o,i)=>`
    <div class="tick" onclick="selAtt('${o.replace(/'/g,"\\'")}',${i})">
      <span class="tbox r" id="ab${i}"><span class="dot"></span></span>
      <span class="tlbl">${o}</span>
    </div>`).join('');

  document.getElementById('activity-list').innerHTML=t.activities.map((a,i)=>`
    <div class="tick" onclick="togAct('${a.replace(/'/g,"\\'")}',${i})">
      <span class="tbox" id="acb${i}"><span class="ck">✓</span></span>
      <span class="tlbl">${a}</span>
    </div>`).join('');

  chkForm();
}

function togRole(r,i){
  const b=document.getElementById('rb'+i);
  if(roles.includes(r)){roles=roles.filter(x=>x!==r);b.classList.remove('on');}
  else{roles.push(r);b.classList.add('on');}
  document.getElementById('other-w').style.display=
    roles.some(x=>x==='Other'||x==='อื่น ๆ')?'block':'none';
  chkForm();
}
function selAtt(o,i){
  attend=o;
  document.querySelectorAll('.tbox.r').forEach(b=>b.classList.remove('on'));
  document.getElementById('ab'+i).classList.add('on');
  chkForm();
}
function togAct(a,i){
  const b=document.getElementById('acb'+i);
  if(activities.includes(a)){activities=activities.filter(x=>x!==a);b.classList.remove('on');}
  else{activities.push(a);b.classList.add('on');}
}
function chkForm(){
  const ok=document.getElementById('f-name').value.trim()
         &&document.getElementById('f-biz').value.trim()
         &&roles.length&&attend
         &&document.getElementById('f-email').value.trim();
  const btn=document.getElementById('submit-btn');
  btn.disabled=!ok; btn.style.opacity=ok?1:.3;
}

async function doSubmit(){
  const t=C[lang];
  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.style.opacity=.5;
  const data={
    name:       document.getElementById('f-name').value.trim(),
    business:   document.getElementById('f-biz').value.trim(),
    role:       [...roles].join(', '),
    roleOther:  document.getElementById('f-other').value.trim(),
    why:        document.getElementById('f-why').value.trim(),
    attendance: attend,
    activities: [...activities].join(', '),
    email:      document.getElementById('f-email').value.trim(),
    phone:      document.getElementById('f-phone').value.trim(),
    line:       document.getElementById('f-line').value.trim(),
    ig:         document.getElementById('f-ig').value.trim(),
    language:   lang
  };
  /* if Formspree not yet configured, show success anyway (preview mode) */
  if(FORMSPREE.includes('YOUR_FORM_ID')){
    document.getElementById('t-msg').textContent=t.thanksMsg;
    document.getElementById('t-sign').textContent=t.thanksSign;
    go('s-thanks');
    return;
  }
  try{
    const res=await fetch(FORMSPREE,{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(data)
    });
    if(res.ok){
      document.getElementById('t-msg').textContent=t.thanksMsg;
      document.getElementById('t-sign').textContent=t.thanksSign;
      go('s-thanks');
    } else {
      throw new Error('server error');
    }
  }catch(e){
    btn.disabled=false; btn.style.opacity=1;
    const el=document.getElementById('f-serr');
    el.textContent=t.storeErr; el.style.display='block';
  }
}
